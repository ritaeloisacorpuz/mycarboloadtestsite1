<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction - myBiblioteque</title>
  
  <!-- 5. Link the external stylesheet (styles.css) inside the <head> section -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    .construction-page-container {
      width: 100%;
      background-color: #dcdcdc;
      padding: 60px 20px 80px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      min-height: 70vh;
    }

    .construction-content-wrapper {
      position: relative;
      max-width: 900px;
      width: 100%;
      text-align: center;
      margin: 0 auto;
    }

    .construction-title {
      font-size: 2.2rem;
      font-weight: 300;
      color: #333333;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }

    .coming-soon-banner-box {
      position: relative;
      max-width: 550px;
      margin: 0 auto;
      background-color: #111111;
      padding: 0;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .coming-soon-banner-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Overlapping Student Graphic at Bottom Right */
    .student-overlay-img {
      position: absolute;
      bottom: -40px;
      right: 15%;
      width: 150px;
      height: auto;
      z-index: 10;
      pointer-events: none;
    }

    /* RESPONSIVE DESIGN (TABLET & MOBILE) */
    @media (max-width: 768px) {
      .construction-page-container {
        padding: 40px 15px 60px 15px;
      }

      .construction-title {
        font-size: 1.6rem;
        margin-bottom: 25px;
      }

      .coming-soon-banner-box {
        max-width: 100%;
      }

      .student-overlay-img {
        width: 110px;
        bottom: -30px;
        right: 5%;
      }
    }

    @media (max-width: 480px) {
      .construction-title {
        font-size: 1.3rem;
      }

      .student-overlay-img {
        width: 90px;
        bottom: -20px;
        right: 2%;
      }
    }
  </style>
</head>
<body>

  <!-- 6. Insert the header placeholder at the very top inside <body> -->
  <div id="header-placeholder"></div>

  <!-- MAIN UNDER CONSTRUCTION CONTENT -->
  <main class="construction-page-container">
    <div class="construction-content-wrapper">
      
      <h1 class="construction-title">This Page is Under Construction</h1>

      <div class="coming-soon-banner-box">
        <img src="images/coming-soon-banner.jpeg" alt="Coming Soon">
      </div>

      <!-- Student with books overlapping graphic -->
      <img src="images/logo-transparent.png" alt="blue-pages-logo" class="student-overlay-img">

    </div>
  </main>

  <!-- 7. Insert the footer placeholder at the very bottom right before </body> -->
  <div id="footer-placeholder"></div>

  <!-- 8. Directly underneath the footer placeholder, include the loader script -->
  <script src="include.js"></script>

</body>
</html>
